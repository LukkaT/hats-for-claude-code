# Example ~/.config/hats/hats.conf — a developer with a personal account, one
# employer, and two clients. Open your own with: hat edit
#
# Every line is "<kind> <name> <value>". Lines starting with # are ignored.

# The account used in folders that have no rule.
default personal

# How the prompt shows the account: clean (the name in its colour), badge, or minimal.
style clean

# profile <name> <config folder> [expected login email]
#   "native" means Claude Code's standard folder, ~/.claude.
#   The email is optional; when set, Hats refuses to start Claude if the profile is
#   signed in as someone else.
profile personal native                       you@example.com
profile work     ~/.claude-profiles/work      you@acme.example
profile client-a ~/.claude-profiles/client-a  you@client-a.example
profile client-b ~/.claude-profiles/client-b

# separate <profile>: this account keeps its own history and memory.
separate client-b

# dir <profile> <folder>: Claude started in this folder, or any folder inside it,
# uses this account. The longest matching folder wins.
dir work     /home/you/code/acme
dir client-a /home/you/code/client-a
dir client-b /home/you/code/client-b
dir personal /home/you/code/acme/my-side-project
